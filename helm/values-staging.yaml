# Environment: Staging - CORRECTED VERSION
global:
  deploymentMode: "cluster"
  environment: staging
  storageClass: "oci-bv"  # ✅ FIXED: Use working storage class
  
  oci:
    enabled: true
    region: "ca-montreal-1"
  
  doppler:
    enabled: true
    project: "oci-infra"
    tokenSecret: "dp.st.dev.CoCYxY6uqifrqLJtP5kv0lAcSGhrfHMfTQ8Xooa4Z8Y"
  
  databases:
    mysql:
      selfHosted:
        enabled: false
      managed:
        enabled: false
    
    mongodb:
      selfHosted:
        enabled: true
        replicaCount: 1
        persistence:
          storageClass: "oci-bv"  # ✅ FIXED
