# Environment: Staging - CORRECTED VERSION
global:
  deploymentMode: "cluster"
  environment: staging
  storageClass: "oci-bv"  # ✅ FIXED: Use working storage class
  
  oci:
    enabled: true
    region: "ca-montreal-1"
  
  doppler:
    enabled: true
    project: "oci-infra"
    tokenSecret: "dp.st.dev.CoCYxY6uqifrqLJtP5kv0lAcSGhrfHMfTQ8Xooa4Z8Y"
  
  databases:
    mysql:
      selfHosted:
        enabled: false
      managed:
        enabled: false
    
    mongodb:
      selfHosted:
        enabled: true
        replicaCount: 1
        persistence:
          storageClass: "oci-bv"  # ✅ FIXED
          size: 50Gi
        auth:
          rootUserSecretKey: MONGODB_ROOT_USERNAME
          rootPasswordSecretKey: MONGODB_ROOT_PASSWORD
      backup:
        enabled: true
        schedule: "0 2 * * *"
        retention: 14
        storageClass: "oci-bv"  # ✅ FIXED
  
  cache:
    redis:
      selfHosted:
        enabled: true
        persistence:
          size: 10Gi
          storageClass: "oci-bv"  # ✅ FIXED
  
  messaging:
    rabbitmq:
      selfHosted:
        enabled: true
        persistence:
          size: 10Gi
          storageClass: "oci-bv"  # ✅ FIXED

# Disable all application services
mainApi:
  enabled: false
authServer:
  enabled: false
notificationService:
  enabled: false

# MongoDB configuration
mongodb:
  internal:
    enabled: true
  external:
    enabled: false
  replicaCount: 1
  resources:
    # limits:
    #   cpu: 2
    #   memory: 4Gi
    requests:
      #cpu: 1
      cpu: 1000m
      memory: 2Gi
    limits: ##ADDED ---
      cpu: 2000m
      memory: 4Gi  ##  ---ADDED
  persistence:
    enabled: true
    # storageClass: "oci-bv"  # ✅ FIXED
    # size: 50Gi
    size: 20Gi           ##ADDED ---
    storageClass: "oci-bv"
  # NEW: Node affinity for database workloads
  affinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: workload-type
          operator: In
          values:
          - stateful-db
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      preference:
        matchExpressions:
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
          - VM.Standard.E4.Flex
  # NEW: Tolerations for database workloads
  tolerations:
    - key: "workload-type"
      operator: "Equal"
      value: "stateful-db"
      effect: "NoSchedule"                     ##  ---ADDED

# Redis configuration
redis:
  internal:
    enabled: true
  external:
    enabled: false
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  persistence:
    enabled: true
    #storageClass: "oci-bv"  # ✅ FIXED   ##ADDED ---
    size: 10Gi
    storageClass: "oci-bv"
  # NEW: Node affinity for database workloads
  affinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: workload-type
          operator: In
          values:
          - stateful-db
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      preference:
        matchExpressions:
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
          - VM.Standard.E4.Flex
  # NEW: Tolerations for database workloads
  tolerations:
    - key: "workload-type"
      operator: "Equal"
      value: "stateful-db"
      effect: "NoSchedule"

# RabbitMQ configuration (already working)
rabbitmq:
  enabled: true
  replicaCount: 1
  cluster:
    replicas: 3
    persistence:
      enabled: true
      storage: 20Gi  ##ADDED
      storageClass: "oci-bv"  # Already correct
    auth:
      usernameSecretKey: RABBITMQ_USERNAME
      passwordSecretKey: RABBITMQ_PASSWORD
    service:
      port: 5672
      managementPort: 15672
  connection:
    internal:
      enabled: true
    external:
      enabled: false
    resources: ##ADDED ---
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    config:
      enableManagement: true
      memoryHighWatermark: 0.6
    # NEW: Node affinity for messaging workloads    #ADDED  ---
    affinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: workload-type
            operator: In
            values:
            - stateful-mq
    # NEW: Tolerations for messaging workloads
    tolerations:
      - key: "workload-type"
        operator: "Equal"
        value: "stateful-mq"
        effect: "NoSchedule"                          # ---ADDED

# Doppler Operator configuration
dopplerOperator:
  install: true
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# MongoDB backup job
mongodb-backup:
  enabled: true
  backup:
    resources:
      limits:
        cpu: 1
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi

# Staging-specific settings
persistence:
  enabled: true
  storageClass: "oci-bv"  # ✅ FIXED

networkPolicy:
  enabled: true

