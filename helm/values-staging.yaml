  enabled: false
authServer:
  enabled: false
notificationService:
  enabled: false

# MongoDB configuration
mongodb:
  internal:
    enabled: true
  external:
    enabled: false
  replicaCount: 1
  resources:
    # limits:
    #   cpu: 2
    #   memory: 4Gi
    requests:
      #cpu: 1
      cpu: 1000m
      memory: 2Gi
    limits: ##ADDED ---
      cpu: 2000m
      memory: 4Gi  ##  ---ADDED
  persistence:
    enabled: true
    # storageClass: "oci-bv"  # ✅ FIXED
    # size: 50Gi
    size: 20Gi           ##ADDED ---
    storageClass: "oci-bv"
  # Node affinity for database workloads
  affinity:
    {{- toYaml .Values.nodeAffinity.database | nindent 4 }}
  # Tolerations for database workloads
  tolerations:
    {{- toYaml .Values.tolerations.database | nindent 4 }}     ##  ---ADDED

# Redis configuration
redis:
  internal:
    enabled: true
  external:
    enabled: false
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  persistence:
    enabled: true
    #storageClass: "oci-bv"  # ✅ FIXED   ##ADDED ---
    size: 10Gi
    storageClass: "oci-bv"
  # Node affinity for database workloads
  affinity:
    {{- toYaml .Values.nodeAffinity.database | nindent 4 }}
  # Tolerations for database workloads
  tolerations:
    {{- toYaml .Values.tolerations.database | nindent 4 }}  ##  ---ADDED

# RabbitMQ configuration (already working)
rabbitmq:
  enabled: true
  replicaCount: 1
  cluster:
    replicas: 3
    persistence:
      enabled: true
      storage: 20Gi  ##ADDED
      storageClass: "oci-bv"  # Already correct
    auth:
      usernameSecretKey: RABBITMQ_USERNAME
      passwordSecretKey: RABBITMQ_PASSWORD
    service:
      port: 5672
      managementPort: 15672
  connection:
    internal:
      enabled: true
    external:
      enabled: false
    resources: ##ADDED ---
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    config:
      enableManagement: true
      memoryHighWatermark: 0.6
    # Node affinity for messaging workloads
    affinity:
      {{- toYaml .Values.nodeAffinity.messaging | nindent 4 }}
    # Tolerations for messaging workloads
    tolerations:
      {{- toYaml .Values.tolerations.messaging | nindent 4 }} # ---ADDED

# Doppler Operator configuration
dopplerOperator:
  install: true
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# MongoDB backup job
mongodb-backup:
  enabled: true
  backup:
    resources:
      limits:
        cpu: 1
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi

# Staging-specific settings
persistence:
  enabled: true
  storageClass: "oci-bv"  # ✅ FIXED

networkPolicy:
  enabled: true

# Node affinity and tolerations for workload distribution  # ADDED  ---
nodeAffinity:
  # Database workloads (MongoDB, Redis) - use high-performance nodes
  database:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: workload-type
          operator: In
          values:
          - stateful-db
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      preference:
        matchExpressions:
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
          - VM.Standard.E4.Flex
  
  # Message queue workloads (RabbitMQ) - use message queue nodes
  messaging:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: workload-type
          operator: In
          values:
          - stateful-mq
  
  # Application workloads - use application nodes
  application:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: workload-type
          operator: In
          values:
          - application

# Tolerations for different workload types
tolerations:
  # Database workloads
  database:
    - key: "workload-type"
      operator: "Equal"
      value: "stateful-db"
      effect: "NoSchedule"
  
  # Message queue workloads
  messaging:
    - key: "workload-type"
      operator: "Equal"
      value: "stateful-mq"
      effect: "NoSchedule"
  
  # Application workloads
  application:
    - key: "workload-type"
      operator: "Equal"
      value: "application"
      effect: "NoSchedule" # ---ADDED